# Продовый стек Pulse.
#
# Запуск:
#   docker compose up -d --build
#
# Переменные из .env файла в этой же директории. Обязательные — см. .env.example.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: pulse
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  migrate:
    # PULSE_IMAGE задаётся в .env: готовый образ из ghcr (быстро) или
    # pulse-app:latest, собранный на месте (docker compose build migrate).
    image: ${PULSE_IMAGE:-pulse-app:latest}
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pulse:${DB_PASSWORD}@postgres:5432/pulse
    command: ["pnpm", "db:migrate"]
    restart: "no"

  app:
    image: ${PULSE_IMAGE:-pulse-app:latest}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://pulse:${DB_PASSWORD}@postgres:5432/pulse
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: https://${DOMAIN}
      # За прокси (Caddy, Cloudflare) Auth.js должен доверять заголовкам Host.
      AUTH_TRUST_HOST: "true"
      SOURCECRAFT_PAT: ${SOURCECRAFT_PAT}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL}
      AI_MONTHLY_BUDGET_RUB: ${AI_MONTHLY_BUDGET_RUB}
      ADMIN_LOGIN: ${ADMIN_LOGIN}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      CRON_SECRET: ${CRON_SECRET}
      BADGE_REFRESH_TZ: ${BADGE_REFRESH_TZ:-Europe/Moscow}
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    expose:
      - "3000"

  worker:
    image: ${PULSE_IMAGE:-pulse-app:latest}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://pulse:${DB_PASSWORD}@postgres:5432/pulse
      SOURCECRAFT_PAT: ${SOURCECRAFT_PAT}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL}
      AI_MONTHLY_BUDGET_RUB: ${AI_MONTHLY_BUDGET_RUB}
      NODE_ENV: production
      WORKER_BATCH_SIZE: "5"
      # Первый запуск после полуночи по этому поясу ставит суточный пересчёт
      # подтверждённых репозиториев («Мои репозитории»).
      BADGE_REFRESH_TZ: ${BADGE_REFRESH_TZ:-Europe/Moscow}
    # Один запуск = одна пачка. Сон 60с между запусками. `|| true` чтобы одна
    # упавшая пачка не роняла контейнер (restart подхватил бы, но лишний шум).
    command: ["sh", "-c", "while true; do pnpm worker || true; sleep 60; done"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Caddyfile.docker — свой TLS через Let's Encrypt;
      # Caddyfile.cloudflare — HTTP за прокси Cloudflare. Выбор в .env.
      - ./deploy/${CADDYFILE:-Caddyfile.docker}:/etc/caddy/Caddyfile:ro
      # Файлы проверки владения доменом при выпуске сертификата.
      - ./deploy/webroot:/webroot:ro
      # Сертификаты, выпущенные вручную (CADDYFILE=Caddyfile.manual-tls).
      - ./deploy/certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
