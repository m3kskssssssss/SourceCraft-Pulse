name: Pulse image

# Сеть продовой ВМ рвётся на сотнях мелких загрузок — собирать образ там нельзя.
# Собираем здесь и кладём в ghcr.io, на сервере остаётся только docker pull.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Имя пакета в ghcr должно быть в нижнем регистре, отсюда ручной вывод тега.
      - name: Собрать и запушить
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pulse:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
